services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bitcoin-network

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "7463:7463"
    environment:
      - MONGO_URL=${MONGO_URL}
      - REDIS_HOST=redis_db
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - CACHE_PREFIX=bitcoin-viewer
      - SECRET=${SECRET}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - mongo_db
      - redis_db
    restart: unless-stopped
    networks:
      - bitcoin-network

  crypto_worker:
    build:
      context: ./backend/crypto_service
      dockerfile: dockerfile
    environment:
      - MONGO_URL=${MONGO_URL}
      - REDIS_HOST=redis_db
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - CACHE_PREFIX=bitcoin-viewer
    depends_on:
      - mongo_db
      - redis_db
    restart: unless-stopped
    networks:
      - bitcoin-network

  mongo_db:
    image: mongo:8.0
    ports:
      - "27017:27017" 
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - bitcoin-network

  redis_db:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "no",
      ]
    restart: unless-stopped
    networks:
      - bitcoin-network

volumes:
  mongo_data:

networks:
  bitcoin-network:
    driver: bridge
